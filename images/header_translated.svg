<!-- Anchor Link Wrapping Direct Text Elements -->
<a id="amcharts-credit" href="https://www.amcharts.com/svg-maps/" target="_blank">
  <!-- Forced Top-Layer Group -->
  <g style="isolation: isolate;">
    <text font-family="Source Sans 3" font-size="6" fill="#C99A3B">
      <textPath href="#line1" textLength="183" lengthAdjust="spacing" >Hail! Prosperity! While the goddess of fortune, the goddess of the great</textPath>
      <textPath href="#line2" textLength="175" lengthAdjust="spacing">of earth, and the goddess of victory became his exclusive right</textPath>
      <textPath href="#line3" textLength="170" lengthAdjust="spacing">he destroyed the ships at Kanthalur Salai, and conquered</textPath>
      <textPath href="#line4" textLength="165" lengthAdjust="spacing">Vengainadu, Gangapadi, Nulambapadi, Thadigaipadi, Kudamalai</textPath>
      <textPath href="#line5" textLength="158" lengthAdjust="spacing">Nadu, Kollam, Kalingam, Elamandalam whose fame </textPath>
      <textPath href="#line6" textLength="158" lengthAdjust="spacing"> spread to all eight directions, and Rattapadi of seven and </textPath>
      <textPath href="#line7" textLength="157" lengthAdjust="spacing">a half lakhs with his formidable and victorious army.</textPath>
      <textPath href="#line8" textLength="158" lengthAdjust="spacing">In the twenty-ninth year of the reign of King</textPath>
      <textPath href="#line9" textLength="154" lengthAdjust="spacing">Rajarakesarivarman, also known as Shri Rajaraja</textPath>
      <textPath href="#line10" textLength="147" lengthAdjust="spacing">Deva, who shines brightly with growing grace</textPath>
      <textPath href="#line11" textLength="138" lengthAdjust="spacing"> through all the ages, the following endowment</textPath>
      <textPath href="#line12" textLength="125" lengthAdjust="spacing"> was made for the sacred lamps of the</textPath>
      <textPath href="#line13" textLength="115" lengthAdjust="spacing">deity at Shri Rajarajeswaram. Shri Rajaraja</textPath>
      <textPath href="#line14" textLength="113" lengthAdjust="spacing"> Deva gave sheep and cattle. With the money</textPath>
      <textPath href="#line15" textLength="111" lengthAdjust="spacing"> given for the cattle, the shepherds are bound</textPath>
      <textPath href="#line16" textLength="106" lengthAdjust="spacing">to measure out ghee for the sacred lamps.</textPath>
      <textPath href="#line17" textLength="86" lengthAdjust="spacing">For one sacred lamp following</textPath>
      <textPath href="#line18" textLength="78" lengthAdjust="spacing">the shepherd lineage, ninety-six
</textPath>
      <textPath href="#line19" textLength="70" lengthAdjust="spacing"> sheep, forty-eight cows,</textPath>
      <textPath href="#line20" textLength="60" lengthAdjust="spacing">and sixteen buffaloes</textPath>
      <textPath href="#line21" textLength="40" lengthAdjust="spacing">were granted as an</textPath>
      <textPath href="#line22">endowment,</textPath>
      
    </text>
  </g>
</a>



<!-- Anchor Link Wrapping Direct Text Elements -->
<a id="amcharts-credit" href="https://www.amcharts.com/svg-maps/" target="_blank">
  <!-- Forced Top-Layer Group -->
  <g style="isolation: isolate;">
    <text font-family="Nirmala UI, Kokila, sans-serif" font-size="6" fill="#C99A3B">
      <textPath href="#line1" textLength="183" lengthAdjust="spacing">𑌸𑍍𑌵𑌸𑍍𑌤𑌿 𑌶𑍍𑌰𑍀 திருமகள் பொலப்பெருநிலச்செல்வியுந்தனக்</textPath>
      <textPath href="#line2" textLength="175" lengthAdjust="spacing">கெயுரிமை பூண்டமை மனக்கொள்க்காந்தளூச்சாலை</textPath>
      <textPath href="#line3" textLength="170" lengthAdjust="spacing">கலமறுத்தருளி வெங்கைநாடுங்கங்கபாடியுநுளம்ப</textPath>
      <textPath href="#line4" textLength="165" lengthAdjust="spacing">பாடியுந்தடிகைபாடியுங்குடமலைநாடுங்கொல்லமு</textPath>
      <textPath href="#line5" textLength="158" lengthAdjust="spacing">ங்கலிங்கமும் எண்டிசை புகழ்தர ஈழமண்டலமும்</textPath>
      <textPath href="#line6" textLength="158" lengthAdjust="spacing"> இரட்டபாடி எழரை இலக்கமுந்திரண்டிறல் வென்</textPath>
      <textPath href="#line7" textLength="157" lengthAdjust="spacing">றித்தண்டாற்கொண்ட தன்னெழில் வளரூழியுளெ</textPath>
      <textPath href="#line8" textLength="158" lengthAdjust="spacing">ல்லாயாண்டுந்தொழுதக விளங்கும் யாண்டெ செ</textPath>
      <textPath href="#line9" textLength="154" lengthAdjust="spacing">ழியரைத்தசு கொள் கொராஐகெஸரிவர்மரான </textPath>
      <textPath href="#line10" textLength="147" lengthAdjust="spacing">𑌶𑍍𑌰𑍀ராஜராஜ தெவர்க்கு யாண்டு இருபத்தொன்</textPath>
      <textPath href="#line11" textLength="138" lengthAdjust="spacing">பதாவது வரை உடையார் 𑌶𑍍𑌰𑍀ராஜராஜீஸ்வர</textPath>
      <textPath href="#line12" textLength="125" lengthAdjust="spacing">ம் உடையார்க்குத் திருருவிளக்குக்கு உ</textPath>
      <textPath href="#line13" textLength="115" lengthAdjust="spacing">டையார் 𑌶𑍍𑌰𑍀ராஜராஜதெவர் குடுத்த</textPath>
      <textPath href="#line14" textLength="113" lengthAdjust="spacing">கால்மாட்டிலுங்குடுத்தார் குடுத்த</textPath>
      <textPath href="#line15" textLength="111" lengthAdjust="spacing">கால்மாட்டிலுங்காசு குடுத்து முத</textPath>
      <textPath href="#line16" textLength="106" lengthAdjust="spacing">லான கால்மாட்டிலும் திருவிளக்கு</textPath>
      <textPath href="#line17" textLength="86" lengthAdjust="spacing">க்கு நெய் அளக்க கடவர்க </textPath>
      <textPath href="#line18" textLength="78" lengthAdjust="spacing">ளாக இடையர் வழி திரு</textPath>
      <textPath href="#line19" textLength="70" lengthAdjust="spacing">விளக்கு ஒன்றினுக்கு</textPath>
      <textPath href="#line20" textLength="60" lengthAdjust="spacing">ஆடு தொண்ணூற்று</textPath>
      <textPath href="#line21" textLength="40" lengthAdjust="spacing">பசு நாற்பத்</textPath>
      <textPath href="#line22">தெட்டாகவும்</textPath>
      
    </text>
  </g>
</a>


</svg>